name: Build
run-name: Build - ${{ github.ref_name }} - ${{ github.event_name }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Validate and build PHAR with DevTools
    runs-on: ubuntu-24.04

    steps:
      - name: Check out CustomToastExample
        uses: actions/checkout@v7.0.1

      - name: Check out pinned CustomToast virion
        uses: actions/checkout@v7.0.1
        with:
          repository: NhanAZ-Libraries/CustomToast
          ref: d86ddaa803e6bf660911e7247adf462450a8b5ed
          path: virions/CustomToast
          persist-credentials: false

      - name: Check out Axolotl-PM source for PHPStan
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out Axolotl-PM PHP setup helper
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl-PM PHP on Node.js 24
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node "$GITHUB_WORKSPACE/.devtools-dependencies/setup-php-action/dist/index.js"

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Lint plugin and verification tools
        shell: bash
        run: find src tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate pinned CustomToast virion and resource pack
        run: php virions/CustomToast/tools/validate.php

      - name: Build standalone PHAR with DevTools
        id: build
        uses: NhanAZ/DevTools@v1.0.1
        with:
          project: .
          virions: virions
          output: build
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm

      - name: Verify shaded library and resource pack
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          php tools/verify-build.php "$PHAR_PATH" virions/CustomToast
          cp "$BUILD_METADATA" build/devtools-build.json

      - name: Upload PHAR from this commit
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build.outputs.plugin-name }}-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            build/devtools-build.json
          if-no-files-found: error
          retention-days: 14
